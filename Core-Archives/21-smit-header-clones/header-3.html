<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header 3 - Work Remotely with Figma</title>
  
  <!-- Google Fonts & Bootstrap 5 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style-header-3.css">
</head>
<body>

  <main class="hero-header">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg container py-4">
      <a class="navbar-brand d-flex align-items-center" href="header-3.html">
        <img src="images/sitelogo.png" alt="SiteLogo" class="logo-img">
      </a>
      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#figmaNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="figmaNav">
        <ul class="navbar-nav mx-auto gap-lg-4">
          <li class="nav-item"><a class="nav-link nav-text" href="header-8.html">About</a></li>
          <li class="nav-item"><a class="nav-link nav-text" href="header-3.html">Features</a></li>
          <li class="nav-item"><a class="nav-link nav-text" href="header-13.html">Pricing</a></li>
          <li class="nav-item"><a class="nav-link nav-text" href="header-8.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link nav-text" href="header-13.html">Team</a></li>
        </ul>
        <a href="header-8.html" class="btn btn-purple px-4 py-2 rounded-pill fw-medium text-white shadow-none">Sing In</a>
      </div>
    </nav>

    <!-- Hero Content -->
    <div class="container py-5 my-auto">
      <div class="row align-items-center">
        <!-- Left Content Column -->
        <div class="col-lg-6 pe-lg-5">
          <h1 class="hero-title fw-bold text-dark mb-4">
            Work Remotely in your home or any other places with <span class="text-purple-highlight">Figma</span>
          </h1>
          <p class="hero-description text-secondary mb-4">
            Want to start your career in design? Join the Figma community — improve your skills and knowledge.
          </p>

          <!-- Email Subscription Form -->
          <form action="header-13.html" method="GET" class="subscribe-card d-flex align-items-center bg-white p-2 rounded-pill shadow-sm mb-3">
            <input type="email" class="form-control border-0 bg-transparent px-3 shadow-none" placeholder="Enter your email Address" required>
            <button type="submit" class="btn btn-purple text-uppercase rounded-pill fw-semibold px-4 py-2.5">SUBSCRIBE</button>
          </form>
        </div>

        <!-- Right 3D Visual Column -->
        <div class="col-lg-6 text-center mt-5 mt-lg-0 position-relative d-flex justify-content-center align-items-center">
          <img src="images/figma-bg-shapes.png" alt="Gradient Background Shapes" class="figma-bg-art">
          <img src="images/figma-mockup.png" alt="Figma Desktop App" class="img-fluid figma-desktop-img position-relative z-1">
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
